<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML OS — Lock Screen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background layers -->
  <div id="bg" class="bg"></div>
  <div id="bgBlur" class="bg blur"></div>

  <!-- Lock screen -->
  <div id="lock" class="lock">
    <div class="lock-card">
      <h1>Sign in</h1>
      <input id="username" placeholder="Username" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="unlockBtn">Unlock</button>
      <div class="links">
        <a href="#" id="forgotBtn">Forgot your password?</a>
        <a href="#" id="createBtn">Create an account</a>
      </div>
    </div>
  </div>

  <!-- Desktop (hidden until unlocked) -->
  <div id="desktop" class="desktop hidden">
    <div class="topbar">
      <div class="left">HTML OS</div>
      <div class="right">
        <button id="settingsBtn" title="Settings">⚙️</button>
      </div>
    </div>

    <div id="icons" class="icons">
      <!-- Placeholder app icons — add/remove easily -->
      <div class="icon" data-app="notes">
        <div class="icon-img">📝</div>
        <div class="icon-label">Notes</div>
      </div>

      <div class="icon" data-app="browser">
        <div class="icon-img">🌐</div>
        <div class="icon-label">Browser</div>
      </div>

      <div class="icon" data-app="settings">
        <div class="icon-img">⚙️</div>
        <div class="icon-label">Settings</div>
      </div>
    </div>

    <div id="windows" class="windows"></div>
  </div>

  <!-- Modals -->
  <div id="createModal" class="modal hidden">
    <div class="modal-card">
      <h2>Create account</h2>
      <input id="createUser" placeholder="Username" />
      <input id="createPass" placeholder="Password" />
      <div class="modal-actions">
        <button id="createCancel">Cancel</button>
        <button id="createSave">Create</button>
      </div>
    </div>
  </div>

  <div id="forgotModal" class="modal hidden">
    <div class="modal-card">
      <h2>Reset password</h2>
      <input id="resetUser" placeholder="Username" />
      <input id="resetPass" placeholder="New password" />
      <div class="modal-actions">
        <button id="resetCancel">Cancel</button>
        <button id="resetSave">Reset</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <label>Background image (file)</label>
      <input id="bgFile" type="file" accept="image/*" />
      <label>or image URL</label>
      <input id="bgUrl" placeholder="https://..." />
      <div class="modal-actions">
        <button id="settingsCancel">Cancel</button>
        <button id="settingsApply">Apply</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web OS - Modular</title>
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/apps.css" />
</head>
<body>

  <div id="bg" class="bg blurred"></div>
  <video id="bgVideo" class="bg blurred hidden" autoplay loop muted playsinline></video>

  <div id="lockScreen" class="lock-container">
    <div class="lock-card">
      <h1>Sign In</h1>
      <div class="avatar">👤</div>
      <input id="username" type="text" placeholder="Username" autocomplete="off" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <div class="lock-links">
        <a href="#" id="openForgot">Forgot Password?</a>
        <a href="#" id="openCreate">Create Account</a>
      </div>
    </div>
  </div>

  <div id="desktop" class="desktop hidden">
    
    <div class="topbar">
      <div class="start-menu">Web OS</div>
      <div class="clock" id="clock">12:00</div>
    </div>

    <div id="icons" class="icons-grid">
      <div class="app-icon" data-app="notes">
        <div class="icon-img">📝</div>
        <span>Notes</span>
      </div>
      <div class="app-icon" data-app="browser">
        <div class="icon-img">🌐</div>
        <span>Browser</span>
      </div>
      <div class="app-icon" data-app="settings">
        <div class="icon-img">⚙️</div>
        <span>Settings</span>
      </div>

      <div class="app-icon" data-app="terminal">
        <div class="icon-img">💻</div>
        <span>Terminal</span>
      </div>
      <div class="app-icon" data-app="calculator">
        <div class="icon-img">🧮</div>
        <span>Calculator</span>
      </div>
      <div class="app-icon" data-app="camera">
        <div class="icon-img">📷</div>
        <span>Camera</span>
      </div>
      <div class="app-icon" data-app="video">
        <div class="icon-img">🎬</div>
        <span>Player</span>
      </div>
    </div>

    <div id="windowArea"></div>

    <div id="taskbar" class="taskbar"></div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="createModal" class="modal-card hidden">
      <h2>Create Account</h2>
      <input id="newUser" placeholder="New Username" />
      <input id="newPass" type="password" placeholder="New Password" />
      <div class="modal-buttons">
        <button class="btn-cancel">Cancel</button>
        <button id="saveCreate" class="btn-primary">Create</button>
      </div>
    </div>

    <div id="forgotModal" class="modal-card hidden">
      <h2>Reset Password</h2>
      <input id="resetUser" placeholder="Username" />
      <input id="resetPass" type="password" placeholder="New Password" />
      <div class="modal-buttons">
        <button class="btn-cancel">Cancel</button>
        <button id="saveReset" class="btn-primary">Reset</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/camera.js"></script>
  <script src="js/apps/video.js"></script>
  <script src="js/system.js"></script>

</body>
</html>

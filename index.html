<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web OS - Prototip</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="bg" class="bg blurred"></div>

  <div id="lockScreen" class="lock-container">
    <div class="lock-card">
      <h1>Giriş Yap</h1>
      <div class="avatar">👤</div>
      <input id="username" type="text" placeholder="Kullanıcı Adı" autocomplete="off" />
      <input id="password" type="password" placeholder="Şifre" />
      <button id="loginBtn">Oturum Aç</button>
      
      <div class="lock-links">
        <a href="#" id="openForgot">Şifremi Unuttum</a>
        <a href="#" id="openCreate">Hesap Oluştur</a>
      </div>
    </div>
  </div>

  <div id="desktop" class="desktop hidden">
    <div class="topbar">
      <div class="start-menu">Web OS</div>
      <div class="clock" id="clock">12:00</div>
    </div>

    <div id="icons" class="icons-grid">
      <div class="app-icon" data-app="notlar">
        <div class="icon-img">📝</div>
        <span>Notlar</span>
      </div>
      <div class="app-icon" data-app="tarayici">
        <div class="icon-img">🌐</div>
        <span>Tarayıcı</span>
      </div>
      <div class="app-icon" data-app="ayarlar">
        <div class="icon-img">⚙️</div>
        <span>Ayarlar</span>
      </div>
    </div>

    <div id="windowArea"></div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    
    <div id="createModal" class="modal-card hidden">
      <h2>Hesap Oluştur</h2>
      <input id="newUser" placeholder="Yeni Kullanıcı Adı" />
      <input id="newPass" type="password" placeholder="Yeni Şifre" />
      <div class="modal-buttons">
        <button class="btn-cancel">İptal</button>
        <button id="saveCreate" class="btn-primary">Oluştur</button>
      </div>
    </div>

    <div id="forgotModal" class="modal-card hidden">
      <h2>Şifre Sıfırla</h2>
      <input id="resetUser" placeholder="Kullanıcı Adı" />
      <input id="resetPass" type="password" placeholder="Yeni Şifre" />
      <div class="modal-buttons">
        <button class="btn-cancel">İptal</button>
        <button id="saveReset" class="btn-primary">Sıfırla</button>
      </div>
    </div>

    <div id="settingsModal" class="modal-card hidden">
      <h2>Görünüm Ayarları</h2>
      <p>Arka plan resmi URL'si girin:</p>
      <input id="bgUrlInput" placeholder="https://ornek.com/resim.jpg" />
      <div class="modal-buttons">
        <button class="btn-cancel">Kapat</button>
        <button id="saveSettings" class="btn-primary">Uygula</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
